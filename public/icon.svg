<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FitMe">
  <!--
    Un disco de barra visto de frente: el anillo es el disco y la barra lo
    atraviesa, asomando a los lados y viéndose por el agujero.

    Por qué esta forma y no una mancuerna, que es lo que pone todo el mundo: un
    disco es también un plato, así que la silueta vale para las dos mitades de
    la app. Y el anillo es ya la imagen de la pantalla principal, donde el día
    se mide con un aro que se va cerrando.

    Está dibujada para los 40 px de una pantalla de inicio, no para los 512 de
    una tienda: dos colores, tres trazos y nada que se empaste al encogerla. Se
    probó a 40, 60, 96 y 180 px antes de dejarla.
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fbe86"/>
      <stop offset="1" stop-color="#06a16b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fondo)"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#fff" stroke-width="8"/>
  <!-- La barra, en tres tramos: los dos que asoman y el que se ve por dentro.
       Partirla es lo que deja el anillo entero sin pintar nada encima. -->
  <g stroke="#fff" stroke-width="7" stroke-linecap="round">
    <path d="M4.5 32h10"/>
    <path d="M49.5 32h10"/>
    <path d="M27.5 32h9"/>
  </g>
</svg>
