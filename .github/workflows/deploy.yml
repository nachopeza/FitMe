# Publica la app en GitHub Pages en cada empujón a master.
#
# El paso `configure-pages` activa Pages por sí mismo (`enablement: true`), así
# que no hace falta tocar los ajustes del repositorio.
#
# La app queda en https://nachopeza.github.io/FitMe/ y se puede instalar en el
# móvil desde el navegador (Compartir → Añadir a pantalla de inicio).
name: Publicar en GitHub Pages

on:
  push:
    branches: [master]
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, se cancela el despliegue anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Los tests bloquean el despliegue: si el dominio se rompe, no se publica.
      - name: Tests
        run: npm test

      - name: Comprobar tipos
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Construir
        run: npm run build

      # `enablement` activa GitHub Pages desde el propio flujo de trabajo, así
      # que no hay que tocar nada en los ajustes del repositorio.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
